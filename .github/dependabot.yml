# Keeps the pinned workflow dependencies current.  Every action is pinned to
# a commit hash with the release in a `# vX.Y.Z` comment (including
# lukka/get-cmake, whose release decides what
# the CI matrix's "latest" CMake resolves to), so these bumps are the one
# upgrade path.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
