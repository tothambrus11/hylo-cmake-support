name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # Default hc, unprefixed like matrix.cmake-version; the release tag's `v` is
  # prepended where the version is used.  A job overrides it with
  # matrix.hylo-version (also unprefixed).
  HYLO_VERSION: 0.0.8

jobs:
  build-and-test:
    name: ${{ matrix.name }} / CMake ${{ matrix.cmake-version }}
    runs-on: ${{ matrix.os }}
    # An `experimental: true` job reports but does not gate (none currently).
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # Every configuration runs against both ends of the supported CMake
        # range: the floor (3.30.0, first with custom transitive properties)
        # and the latest release.  `config` is the second axis; the include
        # entries below attach each config's settings to both versions.
        # (The hc floor, v0.0.8, is the matrix default already.)
        cmake-version: ["3.30.0", "latest"]
        config:
          - linux-ninja
          - linux-ninja-release
          - linux-ninja-multi
          - linux-make
          - linux-arm64
          - macos-arm64
          - windows-ninja
          - windows-vs2026
          - windows-vs2022
          - linux-clang
          - macos-x64
          - windows-clang-cl
          - windows-nmake
          - windows-arm64
        exclude:
          # CMake 3.30 predates the Visual Studio 2026 generator.
          - config: windows-vs2026
            cmake-version: "3.30.0"
          # The toolchain/arch variants are risk coverage, not CMake-version
          # coverage: the core configs already span the version range, so
          # each variant runs once, on the latest CMake.
          - config: linux-clang
            cmake-version: "3.30.0"
          - config: macos-x64
            cmake-version: "3.30.0"
          - config: windows-clang-cl
            cmake-version: "3.30.0"
          - config: windows-nmake
            cmake-version: "3.30.0"
          - config: windows-arm64
            cmake-version: "3.30.0"
        include:
          - config: linux-ninja
            name: Linux x64 (Ninja, Debug)
            os: ubuntu-24.04
            preset: default
          - config: linux-ninja-release
            name: Linux x64 (Ninja, Release)
            os: ubuntu-24.04
            preset: release
          - config: linux-ninja-multi
            name: Linux x64 (Ninja Multi-Config)
            os: ubuntu-24.04
            preset: multi
            build-preset: multi-debug
            test-preset: multi-debug
          - config: linux-make
            name: Linux x64 (Unix Makefiles)
            os: ubuntu-24.04
            preset: make
          - config: linux-arm64
            name: Linux arm64 (Ninja, Debug)
            os: ubuntu-24.04-arm
            preset: default
          # Hylo macOS releases are built on macOS 26 (see setup-hylo's README).
          - config: macos-arm64
            name: macOS arm64 (Ninja, Debug)
            os: macos-26
            preset: default
          - config: windows-ninja
            name: Windows x64 (Ninja, Debug)
            os: windows-latest
            preset: default
          # windows-latest is the windows-2025-vs2026 image (VS 2026, no 2022);
          # VS 2022 lives on the windows-2022 image.  The behaviour suite's VS
          # probe finds whichever is installed, so each job also runs the
          # dedicated generator test against its own VS.
          - config: windows-vs2026
            name: Windows x64 (Visual Studio 2026)
            os: windows-latest
            preset: vs2026
            build-preset: vs2026-debug
            test-preset: vs2026-debug
          - config: windows-vs2022
            name: Windows x64 (Visual Studio 2022)
            os: windows-2022
            preset: vs2022
            build-preset: vs2022-debug
            test-preset: vs2022-debug
          # Toolchain and arch variants (moved from Nightly 2026-08-30: the
          # repo changes rarely, so correctness coverage belongs on PRs).
          - config: linux-clang
            name: Linux x64 (clang)
            os: ubuntu-24.04
            preset: default
            cc: clang
          - config: macos-x64
            name: macOS x64 (Ninja, Debug)
            os: macos-26-intel
            preset: default
          # clang-cl validates that the /INCLUDE:c_malloc_indirect force-link
          # is not MSVC-linker-specific.
          - config: windows-clang-cl
            name: Windows x64 (clang-cl)
            os: windows-latest
            preset: default
            cc: clang-cl
            msvc-arch: x64
          - config: windows-nmake
            name: Windows x64 (NMake Makefiles)
            os: windows-latest
            preset: nmake
            msvc-arch: x64
          # The only cell where the MSVC force-link fix runs on a non-x64 CRT.
          - config: windows-arm64
            name: Windows arm64 (Ninja, Debug)
            os: windows-11-arm
            preset: default
            msvc-arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc-arch || 'x64' }}

      # Pinned CMake + Ninja; FindHylo needs CMake >= 3.30.  The get-cmake
      # release tag doubles as the CMake catalog: what the matrix calls
      # "latest" is the version this pinned release ships, so a Dependabot
      # bump of the action is also the CMake upgrade.
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: ${{ matrix.cmake-version || 'latest' }}

      - name: Install Hylo ${{ matrix.hylo-version || env.HYLO_VERSION }}
        id: hylo
        uses: hylo-lang/setup-hylo@9394a288dc5025755d981eb089b2f2b025d9cc06 # v1.0.0
        with:
          version: v${{ matrix.hylo-version || env.HYLO_VERSION }}

      - name: Toolchain info
        shell: bash
        run: |
          hc --version
          hc --print-stdlib-root
          cmake --version | head -1
          ninja --version

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset || matrix.preset }}

      - name: Test (exit-status tests)
        run: ctest --preset ${{ matrix.test-preset || matrix.preset }} -LE behaviour

      - name: Test (build-system behaviour)
        run: ctest --preset ${{ matrix.test-preset || matrix.preset }} -L behaviour -j 2

      - name: Show project manifest
        if: always()
        shell: bash
        run: cat build*/hylo-project.json || true

      - name: Upload behaviour-test work directories
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behaviour-workdirs-${{ strategy.job-index }}
          path: |
            build*/tests/
            !build*/tests/toolchain-swap/tc-*
            !build*/tests/**/hylo-module-cache
          if-no-files-found: ignore

  cross-aarch64:
    name: Linux x64 -> aarch64 (qemu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - uses: hylo-lang/setup-hylo@9394a288dc5025755d981eb089b2f2b025d9cc06 # v1.0.0
        with:
          version: v${{ env.HYLO_VERSION }}
      - name: Install cross toolchain and qemu
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu qemu-user
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=tests/toolchains/aarch64-linux-gnu.cmake
      - name: Build
        run: cmake --build build
      - name: Linked executables are aarch64
        run: |
          file build/examples/diamond/diamond
          file build/examples/diamond/diamond | grep -q aarch64
      # The behaviour tests configure their fixtures for the host; only the
      # exit-status tests exercise the cross-built programs (under qemu, via
      # each target's CROSSCOMPILING_EMULATOR).
      - name: Test (exit-status tests, under qemu)
        run: ctest --test-dir build -LE behaviour --output-on-failure

  fuzz:
    name: Randomized incremental fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - uses: hylo-lang/setup-hylo@9394a288dc5025755d981eb089b2f2b025d9cc06 # v1.0.0
        with:
          version: v${{ env.HYLO_VERSION }}
      - name: Configure
        env:
          FUZZ_ITERATIONS: 60
        run: cmake -S . -B build -G Ninja -DHYLO_FUZZ=ON
      - name: Build
        run: cmake --build build
      - name: Fuzz
        run: ctest --test-dir build -L fuzz --output-on-failure
      - name: Upload fuzz work directory
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-workdir
          path: |
            build/tests/fuzz-incremental/
            !build/tests/fuzz-incremental/**/hylo-module-cache
          if-no-files-found: ignore
