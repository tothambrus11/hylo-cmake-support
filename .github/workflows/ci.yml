name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # Default hc, unprefixed like matrix.cmake-version; the release tag's `v` is
  # prepended where the version is used.  A job overrides it with
  # matrix.hylo-version (also unprefixed).
  HYLO_VERSION: 0.0.8

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Experimental jobs (new generators) report but do not gate.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (Ninja, Debug)
            os: ubuntu-24.04
            preset: default
          - name: Linux x64 (Ninja, Release)
            os: ubuntu-24.04
            preset: release
          - name: Linux x64 (Ninja Multi-Config)
            os: ubuntu-24.04
            preset: multi
            build-preset: multi-debug
            test-preset: multi-debug
          - name: Linux x64 (Unix Makefiles)
            os: ubuntu-24.04
            preset: make
          # The floor: oldest supported CMake (3.30.0, first with custom
          # transitive properties).  The hc floor (v0.0.8, the current stdlib
          # bundle layout) is already the matrix default.
          - name: Linux x64 (floor - CMake 3.30.0)
            os: ubuntu-24.04
            preset: default
            cmake-version: 3.30.0
          - name: Linux arm64 (Ninja, Debug)
            os: ubuntu-24.04-arm
            preset: default
          # Hylo macOS releases are built on macOS 26 (see setup-hylo's README).
          - name: macOS arm64 (Ninja, Debug)
            os: macos-26
            preset: default
          - name: Windows x64 (Ninja, Debug)
            os: windows-latest
            preset: default
          # windows-latest is the windows-2025-vs2026 image: VS 2026, no 2022.
          - name: Windows x64 (Visual Studio 2026, experimental)
            os: windows-latest
            preset: vs
            build-preset: vs-debug
            test-preset: vs-debug
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Pinned CMake + Ninja; FindHylo needs CMake >= 3.30.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ matrix.cmake-version || 'latest' }}

      - name: Install Hylo ${{ matrix.hylo-version || env.HYLO_VERSION }}
        id: hylo
        uses: hylo-lang/setup-hylo@v1.0.0
        with:
          version: v${{ matrix.hylo-version || env.HYLO_VERSION }}

      - name: Toolchain info
        shell: bash
        run: |
          hc --version
          hc --print-stdlib-root
          cmake --version | head -1
          ninja --version
          # Interface-hash precision probe (notes/TESTING-STRATEGY.md, 3.2):
          # the behaviour tests branch their expected recompile sets on this,
          # and the day it flips to ON, hylo-new#321 has landed.
          d="$RUNNER_TEMP/hash-probe"; mkdir -p "$d/cache"
          for body in 1 2; do
            echo "public fun p() -> Int32 { $body }" > "$d/P.hylo"
            hc --module-name P --module-cache "$d/cache" --emit object -o "$d/P.o" \
               --emit-module-to "$d/P.hylomodule" \
               --emit-module-interface-hash-to "$d/P$body.iface" "$d/P.hylo"
          done
          if cmp -s "$d/P1.iface" "$d/P2.iface"; then
            echo "HASH_PRECISE=ON (interface-only hash)"
          else
            echo "HASH_PRECISE=OFF (whole-archive hash)"
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset || matrix.preset }}

      - name: Test (exit-status tests)
        run: ctest --preset ${{ matrix.test-preset || matrix.preset }} -LE behaviour

      - name: Test (build-system behaviour)
        run: ctest --preset ${{ matrix.test-preset || matrix.preset }} -L behaviour -j 2

      - name: Show project manifest
        if: always()
        shell: bash
        run: cat build*/hylo-project.json || true

      - name: Upload behaviour-test work directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-workdirs-${{ strategy.job-index }}
          path: |
            build*/tests/
            !build*/tests/toolchain-swap/tc-*
            !build*/tests/**/hylo-module-cache
          if-no-files-found: ignore
